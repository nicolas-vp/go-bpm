<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>История экземпляра — go-bpm</title>
  <link rel="stylesheet" href="/ui/static/vendor/bpmn-js-18.31.0/diagram-js.css">
  <link rel="stylesheet" href="/ui/static/vendor/bpmn-js-18.31.0/bpmn-js.css">
  <link rel="stylesheet" href="/ui/static/vendor/dmn-js-17.12.0/dmn-js-shared.css">
  <link rel="stylesheet" href="/ui/static/vendor/dmn-js-17.12.0/dmn-js-decision-table.css">
  <link rel="stylesheet" href="/ui/static/vendor/dmn-js-17.12.0/dmn-js-drd.css">
  <link rel="stylesheet" href="/ui/static/vendor/dmn-js-17.12.0/dmn-font-embedded.css">
  <link rel="stylesheet" href="/ui/static/style.css">
  <link rel="stylesheet" href="/ui/static/history.css">
</head>
<body class="history-page">
  <!-- шапка - как у консоли /ui/; история - часть раздела «Экземпляры» -->
  <header class="bar">
    <h1>go-bpm</h1>
    <nav class="tabs" aria-label="Разделы">
      <a href="/ui/#/processes">Процессы</a>
      <a href="/ui/#/start">Запуск</a>
      <a href="/ui/#/instances" aria-current="page">Экземпляры</a>
      <a href="/ui/#/tasks">Задачи</a>
    </nav>
  </header>

  <section class="summary">
    <div class="summary-main">
      <div id="parent" class="parent" hidden></div>
      <div id="info" class="info">Экземпляр не выбран — откройте его в разделе <a href="/ui/#/instances">Экземпляры</a></div>
    </div>
    <div class="legend">
      <span><i class="swatch swatch-completed"></i>пройдено</span>
      <span><i class="swatch swatch-active"></i>выполняется</span>
      <span><i class="swatch swatch-terminated"></i>прервано</span>
      <span class="hint">клик по элементу — переменные и подпроцессы</span>
    </div>
  </section>
  <div id="error" class="error" hidden></div>

  <div class="workspace">
    <main id="canvas" class="canvas"></main>
    <aside id="panel" class="panel" hidden>
      <header class="panel-head">
        <div>
          <div id="panel-title" class="panel-title"></div>
          <div id="panel-type" class="panel-type"></div>
        </div>
        <button id="panel-close" class="panel-close" type="button" aria-label="Закрыть">×</button>
      </header>
      <div id="panel-body" class="panel-body"></div>
    </aside>
  </div>

  <dialog id="rules" class="rules" aria-labelledby="rules-title">
    <header class="panel-head">
      <div>
        <div id="rules-title" class="panel-title"></div>
        <div id="rules-subtitle" class="panel-type"></div>
      </div>
      <button id="rules-close" class="panel-close" type="button" aria-label="Закрыть">×</button>
    </header>
    <div class="rules-bar">
      <div id="rules-calls" class="rules-calls"></div>
      <div class="legend"><span><i class="swatch swatch-rule"></i>сработало</span></div>
    </div>
    <div id="rules-message" class="rules-message" hidden></div>
    <pre id="rules-result" class="vars rules-result" hidden></pre>
    <div id="rules-canvas" class="rules-canvas"></div>
  </dialog>

  <script src="/ui/static/vendor/bpmn-js-18.31.0/bpmn-navigated-viewer.production.min.js"></script>
  <script src="/ui/static/vendor/dmn-js-17.12.0/dmn-viewer.production.min.js"></script>
  <script src="/ui/static/history.js"></script>
</body>
</html>
