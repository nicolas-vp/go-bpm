name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: go_bpm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # последний патч 1.26, как golang:1.26-alpine в Dockerfile: go.mod задаёт только минимальную версию,
      # а уязвимости стандартной библиотеки исправляются патчами
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
      - run: make lint
      # уязвимости в коде, который действительно вызывается: модули и стандартная библиотека
      - run: make vulncheck
      # сгенерированный код демо должен совпадать с BPMN
      - run: make generate && git diff --exit-code
      - run: make test
        env:
          GO_BPM_TEST_DSN: postgres://postgres:postgres@localhost:5432/go_bpm_test?sslmode=disable

  # образ демо-сервиса ghcr.io/<владелец>/go-bpm: на pull request только сборка, из main и тегов v* - публикация
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # id-token - подпись образа cosign без ключей (OIDC-токен GitHub)
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # main - latest и sha-<коммит>; тег v1.2.3 - 1.2.3 и 1.2
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # SBOM и provenance публикуются в ghcr.io вместе с образом, как аттестации
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # подпись по digest: подпись и сертификат - в ghcr.io рядом с образом, запись - в публичном журнале Rekor.
      # Проверка: cosign verify ghcr.io/<владелец>/go-bpm:<тег>
      #   --certificate-identity-regexp 'https://github.com/<владелец>/go-bpm/' --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'
      - name: sign
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"

  # выкладка на сервер из main: deploy/deploy.sh на сервере пересоздаёт приложение из нового образа, база остаётся.
  # Секреты: DEPLOY_HOST, DEPLOY_SSH_KEY (ключ, которому на сервере разрешён только deploy.sh), DEPLOY_KNOWN_HOSTS
  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      # тег sha-<7 знаков коммита> - тот же, что ставит docker/metadata-action в job image
      - name: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -o BatchMode=yes "root@$DEPLOY_HOST" "sha-${GITHUB_SHA::7} ${{ github.actor }} $TOKEN" < compose.yaml
